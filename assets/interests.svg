<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Áreas de interesse de Pablo Oliveira</title>
  <desc id="desc">Cibersegurança: Application Security, segurança ofensiva, OSINT, Cloud Security e automação de segurança. Engenharia de software: Python, FastAPI, backend, APIs, análise de dados, arquitetura e DevOps. A interseção é o desenvolvimento de ferramentas para investigar sistemas.</desc>
