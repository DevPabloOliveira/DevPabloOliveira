<svg xmlns="http://www.w3.org/2000/svg" width="900" height="584" viewBox="0 0 900 584" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Tecnologias e ferramentas de Pablo Oliveira</title>
  <desc id="desc">Backend e automação: Python, FastAPI, REST APIs, asyncio, scripts e automação de processos. Dados: PostgreSQL, MySQL, PostGIS, Jupyter, Pandas, Plotly e Matplotlib. Web: JavaScript, TypeScript, React, HTML e CSS. DevOps e Cloud: Linux, Docker, Git, GitHub Actions, Azure, Azure DevOps e Railway. Segurança: Burp Suite, Nmap, Wireshark, BloodHound, Hashcat, Gophish e ferramentas de análise OSINT.</desc>
