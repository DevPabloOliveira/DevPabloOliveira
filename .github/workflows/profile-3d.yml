name: Generate 3D contribution graph

on:
  push:
    paths:
      - 'scripts/generate-activity.mjs'
      - '.github/workflows/profile-3d.yml'
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate contribution graph
        run: node scripts/generate-activity.mjs
        env:
          PROFILE_USERNAME: DevPabloOliveira

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git diff --cached --quiet || git commit -m "chore(profile): update contribution graph"
          git push
